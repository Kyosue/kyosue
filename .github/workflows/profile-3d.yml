name: Update 3D contrib profile

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - ".github/workflows/profile-3d.yml"
      - ".github/profile-3d-settings.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Generate 3D contrib profile
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Strip pie chart, web stats, and date
        run: |
          node <<'EOF'
          const fs = require('fs');
          const src = 'profile-3d-contrib/profile-3d-contrib.svg';
          const dest = 'profile/3d-contrib.svg';

          function removeBalancedGroup(html, startMarker) {
            const start = html.indexOf(startMarker);
            if (start < 0) return html;
            let i = start + startMarker.length;
            let depth = 1;
            while (i < html.length && depth > 0) {
              const nextOpen = html.indexOf('<g', i);
              const nextClose = html.indexOf('</g>', i);
              if (nextClose < 0) break;
              if (nextOpen >= 0 && nextOpen < nextClose) {
                depth++;
                i = nextOpen + 2;
              } else {
                depth--;
                i = nextClose + 4;
              }
            }
            return html.slice(0, start) + html.slice(i);
          }

          let svg = fs.readFileSync(src, 'utf8');

          // Language pie chart lives at a fixed translate in create-svg.ts
          svg = removeBalancedGroup(svg, '<g transform="translate(40, 520)">');

          // Remove footer stats group (contributions/stars/forks + date range)
          const svgEnd = svg.lastIndexOf('</svg>');
          const lastG = svg.lastIndexOf('<g>', svgEnd);
          if (lastG >= 0) {
            svg = svg.slice(0, lastG) + svg.slice(svgEnd);
          }

          fs.mkdirSync('profile', { recursive: true });
          fs.writeFileSync(dest, svg);
          console.log(`Wrote ${dest}`);
          EOF

      - name: Remove intermediate SVG
        run: rm -rf profile-3d-contrib

      - name: Commit 3D contrib profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/3d-contrib.svg
          git commit -m "Update 3D contrib profile" || exit 0
          git push
