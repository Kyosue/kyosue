name: Update contribution graph

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - ".github/workflows/contrib-graph.yml"
      - ".github/scripts/generate-contrib-svg.js"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Generate flat contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate-contrib-svg.js ${{ github.repository_owner }} profile/contrib.svg

      - name: Commit contribution graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/contrib.svg
          git commit -m "Update contribution graph" || exit 0
          git push
